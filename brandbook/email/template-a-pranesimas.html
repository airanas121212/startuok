<!DOCTYPE html>
<html lang="lt-LT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Nauja užklausa – Startuok</title>
</head>
<body style="margin:0;padding:0;background-color:#F5F8FD;font-family:Manrope,'Avenir Next','Segoe UI Variable',Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F8FD;">
<tr><td align="center" style="padding:28px 16px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#FFFFFF;border:1px solid #D9E4F2;border-radius:16px;">

<tr><td style="padding:28px 32px 4px 32px;">
<span style="display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#0F86FF;">{{source}}</span>
<h1 style="margin:6px 0 0;font-size:21px;line-height:1.3;font-weight:700;color:#07152E;">Nauja užklausa – {{name}}</h1>
</td></tr>

<tr><td style="padding:18px 32px 0 32px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
<tr><td style="padding:9px 0;border-top:1px solid #EDF1F7;color:#61718B;font-size:12px;width:150px;vertical-align:top;">Vardas</td><td style="padding:9px 0;border-top:1px solid #EDF1F7;color:#07152E;font-size:14px;font-weight:600;">{{name}}</td></tr>
<tr><td style="padding:9px 0;border-top:1px solid #EDF1F7;color:#61718B;font-size:12px;vertical-align:top;">El. paštas</td><td style="padding:9px 0;border-top:1px solid #EDF1F7;color:#07152E;font-size:14px;"><a href="mailto:{{email}}" style="color:#0F86FF;text-decoration:underline;">{{email}}</a></td></tr>
<tr><td style="padding:9px 0;border-top:1px solid #EDF1F7;color:#61718B;font-size:12px;vertical-align:top;">Telefonas</td><td style="padding:9px 0;border-top:1px solid #EDF1F7;color:#07152E;font-size:14px;">{{phone}}</td></tr>
<tr><td style="padding:9px 0;border-top:1px solid #EDF1F7;color:#61718B;font-size:12px;vertical-align:top;">Įmonė / svetainė</td><td style="padding:9px 0;border-top:1px solid #EDF1F7;color:#07152E;font-size:14px;">{{company}}</td></tr>
<tr><td style="padding:9px 0;border-top:1px solid #EDF1F7;color:#61718B;font-size:12px;vertical-align:top;">Paslauga</td><td style="padding:9px 0;border-top:1px solid #EDF1F7;color:#07152E;font-size:14px;font-weight:600;">{{service}}</td></tr>
<tr><td style="padding:9px 0;border-top:1px solid #EDF1F7;color:#61718B;font-size:12px;vertical-align:top;">Biudžetas</td><td style="padding:9px 0;border-top:1px solid #EDF1F7;color:#07152E;font-size:14px;">{{budget}}</td></tr>
<tr><td style="padding:9px 0;border-top:1px solid #EDF1F7;color:#61718B;font-size:12px;vertical-align:top;">Pageidaujama data</td><td style="padding:9px 0;border-top:1px solid #EDF1F7;color:#07152E;font-size:14px;">{{timing}}</td></tr>
</table>
</td></tr>

<tr><td style="padding:20px 32px 0 32px;">
<span style="display:block;color:#61718B;font-size:12px;margin-bottom:6px;">Žinutė / klausimyno santrauka</span>
<div style="padding:14px 16px;background-color:#EDF5FF;border-radius:11px;color:#07152E;font-size:14px;line-height:1.6;white-space:pre-wrap;">{{message}}</div>
</td></tr>

<tr><td style="padding:20px 32px 28px 32px;">
<span style="display:block;border-top:1px solid #D9E4F2;padding-top:14px;color:#61718B;font-size:12px;">Gauta: {{submitted_at}}</span>
</td></tr>

</table>
</td></tr>
</table>
</body>
</html>
