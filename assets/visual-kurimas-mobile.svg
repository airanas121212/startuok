<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">Shopify parduotuvės kūrimo mobilus pavyzdys</title><desc id="desc">Aiškus pasiūlymas, katalogas, mobilus pirkimas ir analitika kompaktiškame lange.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef5ff"/><stop offset="1" stop-color="#dceaff"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f86ff"/><stop offset="1" stop-color="#3157ff"/></linearGradient></defs>
  <rect width="760" height="760" fill="url(#bg)"/><rect x="24" y="20" width="712" height="720" rx="28" fill="#fff" stroke="#c8d9ee" stroke-width="3"/><rect x="24" y="20" width="712" height="54" rx="28" fill="#f2f6fb"/><circle cx="56" cy="47" r="6" fill="#bcc9da"/><circle cx="78" cy="47" r="6" fill="#bcc9da"/><circle cx="100" cy="47" r="6" fill="#bcc9da"/><rect x="136" y="35" width="300" height="24" rx="9" fill="#fff"/>
  <rect x="48" y="98" width="664" height="242" rx="24" fill="#07152e"/><g font-family="Arial,sans-serif"><text x="80" y="142" fill="#69b4ff" font-size="19" font-weight="800">PAGRINDINIS PASIŪLYMAS</text><text x="80" y="190" fill="#fff" font-size="38" font-weight="900">Aišku, ką parduodate.</text><text x="80" y="232" fill="#fff" font-size="38" font-weight="900">Pirkti paprasta.</text><text x="80" y="272" fill="#b7c9e1" font-size="20" font-weight="600">Svarbiausia informacija matoma iš karto.</text><rect x="80" y="290" width="160" height="36" rx="10" fill="url(#blue)"/><text x="118" y="315" fill="#fff" font-size="17" font-weight="800">PERŽIŪRĖTI</text></g>
  <g font-family="Arial,sans-serif"><g transform="translate(48 370)"><rect width="316" height="142" rx="20" fill="#f8fbff" stroke="#d5e2f1" stroke-width="2"/><circle cx="48" cy="52" r="28" fill="#b8d7ff"/><text x="92" y="50" fill="#07152e" font-size="24" font-weight="900">Katalogas</text><text x="92" y="80" fill="#526681" font-size="19" font-weight="600">Lengva rasti produktus.</text></g><g transform="translate(396 370)"><rect width="316" height="142" rx="20" fill="#f8fbff" stroke="#d5e2f1" stroke-width="2"/><rect x="22" y="24" width="52" height="72" rx="14" fill="#0f86ff" opacity=".22"/><text x="92" y="50" fill="#07152e" font-size="24" font-weight="900">Mobilus pirkimas</text><text x="92" y="80" fill="#526681" font-size="19" font-weight="600">Dydis ir kaina aiškūs.</text></g><g transform="translate(48 540)"><rect width="664" height="164" rx="20" fill="#f8fbff" stroke="#d5e2f1" stroke-width="2"/><rect x="24" y="26" width="170" height="112" rx="16" fill="#07152e"/><rect x="54" y="76" width="24" height="38" rx="6" fill="#0f86ff"/><rect x="92" y="58" width="24" height="56" rx="6" fill="#3157ff"/><rect x="130" y="70" width="24" height="44" rx="6" fill="#55aaff"/><text x="226" y="68" fill="#07152e" font-size="26" font-weight="900">Aiški analitika</text><text x="226" y="102" fill="#526681" font-size="19" font-weight="600">Pardavimai ir pirkėjų kelias</text><text x="226" y="130" fill="#526681" font-size="19" font-weight="600">matuojami nuo paleidimo.</text></g></g>
</svg>
