<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Aiškios Shopify parduotuvės struktūros pavyzdys</title><desc id="desc">Parduotuvės pagrindinis pasiūlymas, katalogas, mobilus pirkimas ir analitika parodyti aiškiuose atskiruose blokuose.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef5ff"/><stop offset="1" stop-color="#dceaff"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f86ff"/><stop offset="1" stop-color="#3157ff"/></linearGradient></defs>
  <rect width="1200" height="760" fill="url(#bg)"/><rect x="58" y="44" width="1084" height="672" rx="30" fill="#fff" stroke="#c9d9ee" stroke-width="4"/>
  <rect x="92" y="78" width="1016" height="50" rx="14" fill="#f1f5fb"/><circle cx="122" cy="103" r="7" fill="#bcc9da"/><circle cx="146" cy="103" r="7" fill="#bcc9da"/><circle cx="170" cy="103" r="7" fill="#bcc9da"/><rect x="222" y="89" width="390" height="28" rx="10" fill="#fff"/>
  <rect x="92" y="154" width="652" height="244" rx="24" fill="#07152e"/>
  <g font-family="Arial,sans-serif"><text x="128" y="204" fill="#69b4ff" font-size="20" font-weight="800" letter-spacing="1.5">PAGRINDINIS PASIŪLYMAS</text><text x="128" y="258" fill="#fff" font-size="42" font-weight="900">Aišku, ką parduodate</text><text x="128" y="306" fill="#fff" font-size="42" font-weight="900">ir kodėl verta rinktis.</text><text x="128" y="350" fill="#b7c9e1" font-size="21" font-weight="600">Svarbiausia informacija matoma iš karto.</text><rect x="128" y="366" width="166" height="42" rx="11" fill="url(#blue)"/><text x="166" y="394" fill="#fff" font-size="18" font-weight="800">PERŽIŪRĖTI</text></g>
  <rect x="770" y="154" width="338" height="244" rx="24" fill="#eaf3ff"/><circle cx="939" cy="264" r="82" fill="#b8d7ff"/><rect x="908" y="214" width="62" height="114" rx="22" fill="#fff" stroke="#bfd2e8" stroke-width="3"/><text x="939" y="360" text-anchor="middle" fill="#173b68" font-family="Arial,sans-serif" font-size="22" font-weight="800">Produkto pristatymas</text>
  <g font-family="Arial,sans-serif"><g transform="translate(92 430)"><rect width="316" height="244" rx="22" fill="#fff" stroke="#d7e4f2" stroke-width="3"/><rect x="20" y="20" width="276" height="94" rx="16" fill="#edf5ff"/><circle cx="158" cy="67" r="34" fill="#b8d7ff"/><text x="24" y="158" fill="#07152e" font-size="26" font-weight="900">Tvarkingas katalogas</text><text x="24" y="194" fill="#526681" font-size="19" font-weight="600">Produktus lengva rasti.</text><text x="24" y="222" fill="#526681" font-size="19" font-weight="600">Filtrai ir kolekcijos aiškūs.</text></g><g transform="translate(442 430)"><rect width="316" height="244" rx="22" fill="#fff" stroke="#d7e4f2" stroke-width="3"/><rect x="20" y="20" width="276" height="94" rx="16" fill="#edf5ff"/><rect x="118" y="34" width="80" height="68" rx="18" fill="#0f86ff" opacity=".22"/><text x="24" y="158" fill="#07152e" font-size="26" font-weight="900">Mobilus pirkimas</text><text x="24" y="194" fill="#526681" font-size="19" font-weight="600">Dydis, kaina ir pristatymas</text><text x="24" y="222" fill="#526681" font-size="19" font-weight="600">matomi vienoje vietoje.</text></g><g transform="translate(792 430)"><rect width="316" height="244" rx="22" fill="#fff" stroke="#d7e4f2" stroke-width="3"/><rect x="20" y="20" width="276" height="94" rx="16" fill="#07152e"/><path d="M54 92h208" stroke="#244773" stroke-width="4"/><rect x="64" y="60" width="34" height="32" rx="7" fill="#0f86ff"/><rect x="118" y="42" width="34" height="50" rx="7" fill="#3157ff"/><rect x="172" y="54" width="34" height="38" rx="7" fill="#55aaff"/><rect x="226" y="28" width="34" height="64" rx="7" fill="#0f86ff"/><text x="24" y="158" fill="#07152e" font-size="26" font-weight="900">Aiški analitika</text><text x="24" y="194" fill="#526681" font-size="19" font-weight="600">Pardavimai ir pirkėjų kelias</text><text x="24" y="222" fill="#526681" font-size="19" font-weight="600">matuojami nuo paleidimo.</text></g></g>
