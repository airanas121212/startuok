name: Deploy Startuok to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/blogas
          cp -a .nojekyll CNAME 404.html index.html privatumas.html robots.txt script.js site.webmanifest sitemap.xml styles.css _site/
          cp -a assets apie-mus aptarti-projekta duk klausimynas kontaktai migracija-i-shopify paslaugos-ir-kainos shopify-integracijos shopify-parduotuviu-kurimas _site/
          cp -a blogas/blog.css blogas/index.html blogas/kiek-kainuoja-shopify-parduotuve-lietuvoje-2026 _site/blogas/

          if find _site -type f \( -iname '*backup*' -o -iname '*.md' -o -iname '*.ps1' -o -iname '*.log' \) -print -quit | grep -q .; then
            echo 'Source-only file found in the public artifact.' >&2
            exit 1
          fi

      - name: Verify clean public URLs
        run: node tools/check-clean-urls.mjs _site

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
